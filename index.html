<script>
const {
  useState
} = React;
const COLORS = {
  bg: "#F7F3EE",
  card: "#FFFFFF",
  border: "#E8E0D8",
  primary: "#1B2B1B",
  accent: "#C4956A",
  accentDark: "#8B6914",
  text: "#1A1A1A",
  muted: "#7A7268",
  good: "#2D6A4F",
  warn: "#CC8B00",
  bad: "#9B2C2C"
};
const fmt = n => {
  if (n == null || isNaN(n)) return "$0";
  const abs = Math.abs(n);
  if (abs >= 1e6) return (n < 0 ? "-" : "") + "$" + (abs / 1e6).toFixed(1) + "M";
  if (abs >= 1e3) return (n < 0 ? "-" : "") + "$" + (abs / 1e3).toFixed(1) + "K";
  return "$" + n.toLocaleString("en-US", {
    minimumFractionDigits: 0,
    maximumFractionDigits: 0
  });
};
const pct = n => n == null || isNaN(n) ? "0%" : Math.round(n * 100) + "%";
const parseNum = str => parseFloat((str || "").replace(/[^0-9.]/g, "")) || 0;
const fmtInput = val => {
  const raw = val.replace(/[^0-9]/g, "");
  return raw ? Number(raw).toLocaleString() : "";
};
const inputStyle = {
  width: "100%",
  padding: "12px 12px 12px 26px",
  fontSize: 15,
  border: `1.5px solid ${COLORS.border}`,
  borderRadius: 8,
  fontFamily: "'Sora', sans-serif",
  color: COLORS.primary,
  outline: "none",
  background: "#fff"
};
const nameInputStyle = {
  ...inputStyle,
  paddingLeft: 12
};
const labelStyle = {
  fontSize: 12,
  fontWeight: 600,
  color: COLORS.primary,
  display: "block",
  marginBottom: 6
};
const cardStyle = {
  background: COLORS.card,
  borderRadius: 12,
  border: `1px solid ${COLORS.border}`,
  padding: 24,
  boxShadow: "0 1px 3px rgba(0,0,0,0.04)"
};
const metricBox = {
  padding: 16,
  background: COLORS.bg,
  borderRadius: 10
};
const metricLabel = {
  fontSize: 11,
  textTransform: "uppercase",
  letterSpacing: 1.2,
  color: COLORS.muted,
  marginBottom: 6,
  fontWeight: 600
};
const metricValue = {
  fontSize: 24,
  fontWeight: 700,
  fontFamily: "'Crimson Pro', serif"
};
const metricSub = {
  fontSize: 11,
  color: COLORS.muted,
  marginTop: 4
};

// CareerOneStop Salary Finder: BLS OEWS wages at all five percentiles, for the metro nearest a ZIP or city
const wageFinderUrl = (keyword, soc, location) => {
  const k = encodeURIComponent(keyword || "");
  let url = `https://www.careeronestop.org/Toolkit/Wages/find-salary.aspx?keyword=${k}`;
  const code = (soc || "").replace(/[^0-9]/g, "");
  if (code.length === 6) url += `&soccode=${code}`;
  if (location && location.trim()) url += `&location=${encodeURIComponent(location.trim())}`;
  return url + `&keywordSearched=${k}`;
};
const PCT_KEYS = ["p10", "p25", "p50", "p75", "p90"];
const nearestWage = (r, key) => {
  const i = PCT_KEYS.indexOf(key);
  const order = [i, i - 1, i + 1, i - 2, i + 2, i - 3, i + 3, i - 4, i + 4].filter(x => x >= 0 && x < 5);
  for (const j of order) {
    const v = Number(r[PCT_KEYS[j]]);
    if (v > 0) return v;
  }
  return 0;
};
// CareerOneStop publishes Low (10th), Median (50th) and High (90th).
// Wages are right-skewed, so the 25th and 75th are estimated on a log-normal curve through those points
// rather than straight midpoints. Against published full-percentile data this lands within a few percent.
const CURVE_WEIGHT = 0.6745 / 1.2816; // z-score of the 25th/75th relative to the 10th/90th
const deriveQuartiles = (low, med, high) => ({
  p10: low,
  p50: med,
  p90: high,
  p25: low > 0 && med > 0 ? med * Math.pow(low / med, CURVE_WEIGHT) : 0,
  p75: med > 0 && high > 0 ? med * Math.pow(high / med, CURVE_WEIGHT) : 0
});
const expKey = y => y < 3 ? "p25" : y < 6 ? "p50" : y < 11 ? "p75" : "p90";
// 2026 payroll tax and retirement limits (SSA wage base; IRS Notice 2025-67)
const SS_WAGE_BASE = 184500;
const ANNUAL_ADDITIONS_LIMIT = 72000; // SEP and Solo 401(k) combined cap
const DEFERRAL_LIMIT = 24500;
const CATCHUP = {
  under50: 0,
  "50to59": 8000,
  "60to63": 11250,
  "64plus": 8000
};
const AGE_LABELS = {
  under50: "Under 50",
  "50to59": "50 to 59",
  "60to63": "60 to 63",
  "64plus": "64 or older"
};
// Combined employer + employee FICA: 12.4% Social Security up to the wage base, 2.9% Medicare on all wages
const ficaTotal = w => 0.124 * Math.min(Math.max(w, 0), SS_WAGE_BASE) + 0.029 * Math.max(w, 0);
const ficaEmployer = w => 0.062 * Math.min(Math.max(w, 0), SS_WAGE_BASE) + 0.0145 * Math.max(w, 0);
const sepMax = w => Math.min(0.25 * w, ANNUAL_ADDITIONS_LIMIT);
const solo401kMax = (w, age = "under50") => {
  const deferral = Math.min(DEFERRAL_LIMIT, w);
  const base = Math.min(deferral + 0.25 * w, ANNUAL_ADDITIONS_LIMIT);
  const catchup = Math.min(CATCHUP[age] || 0, Math.max(0, w - deferral));
  return base + catchup;
};
const SALARY_TO_MAX_SEP = ANNUAL_ADDITIONS_LIMIT / 0.25;
